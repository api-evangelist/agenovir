name: Agenovir
description: Agenovir Corporation was a biotechnology company founded in 2014 to develop a novel class
  of human therapeutics targeting diseases caused by latent or persistent viral reservoirs. Built on
  CRISPR/Cas9 and other nuclease technology from the Stephen Quake lab at Stanford, it designed and
  simulated nucleases in silico at scale to disrupt intracellular viral DNA. It raised a $10.6M Series A
  led by DCVC (Data Collective) with Celgene and Lightspeed Venture Partners, and was acquired by Vir
  Biotechnology in 2018. It is a therapeutics company with no public developer, API, or SDK surface.
